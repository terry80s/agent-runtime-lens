apiVersion: v1
kind: Namespace
metadata:
  name: agent-runtime-lens-test
---
apiVersion: v1
kind: Secret
metadata:
  name: ssh-public-key
  namespace: agent-runtime-lens-test
type: Opaque
stringData:
  authorized_keys: REPLACE_WITH_ONE_SSH_PUBLIC_KEY
---
apiVersion: v1
kind: Pod
metadata:
  name: vscode-workspace
  namespace: agent-runtime-lens-test
  labels:
    app: vscode-workspace
spec:
  containers:
    - name: workspace
      image: lscr.io/linuxserver/openssh-server:latest
      ports:
        - containerPort: 2222
          name: ssh
      env:
        - name: USER_NAME
          value: developer
        - name: PUBLIC_KEY_FILE
          value: /run/agent-runtime-lens/authorized_keys
        - name: AGENT_RUNTIME_LENS_EPHEMERAL_STORAGE_LIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.ephemeral-storage
              divisor: "1"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
          ephemeral-storage: 1Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: ssh-public-key
          mountPath: /run/agent-runtime-lens
          readOnly: true
      readinessProbe:
        tcpSocket:
          port: ssh
        initialDelaySeconds: 5
        periodSeconds: 3
  volumes:
    - name: workspace
      emptyDir:
        sizeLimit: 768Mi
    - name: ssh-public-key
      secret:
        secretName: ssh-public-key
        defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: vscode-workspace-ssh
  namespace: agent-runtime-lens-test
spec:
  type: NodePort
  selector:
    app: vscode-workspace
  ports:
    - name: ssh
      port: 22
      targetPort: 2222
      nodePort: 30222
